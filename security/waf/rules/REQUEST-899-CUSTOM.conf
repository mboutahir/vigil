# Block requests to /internal/.
SecRule REQUEST_URI "@beginsWith /internal/" "id:100001,phase:1,deny,status:404,log,msg:'Vigil internal route blocked'"

# Keep rule match details out of audit logs for password submissions.
SecRule REQUEST_METHOD "@streq POST" \
    "id:100008,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_FILENAME "@rx ^/api/(?:auth/login|setup|users)$" \
        "t:none,setvar:tx.vigil_password_route=1,ctl:auditLogParts=-H"

SecRule REQUEST_METHOD "@streq PATCH" \
    "id:100009,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_FILENAME "@rx ^/api/users/(?:me|[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12})$" \
        "t:none,setvar:tx.vigil_password_route=1,ctl:auditLogParts=-H"

# Skip the signatures that flagged valid passwords. Query args can share JSON field names.
SecRule TX:vigil_password_route "@eq 1" \
    "id:100010,phase:2,pass,nolog,t:none,chain"
    SecRule REQBODY_PROCESSOR "@streq JSON" "t:none,chain"
        SecRule &ARGS_GET "@eq 0" \
            "t:none,ctl:ruleRemoveTargetById=930120;ARGS:json.password,\
            ctl:ruleRemoveTargetById=932130;ARGS:json.password,\
            ctl:ruleRemoveTargetById=932160;ARGS:json.password,\
            ctl:ruleRemoveTargetById=933135;ARGS:json.password,\
            ctl:ruleRemoveTargetById=941100;ARGS:json.password"

# Skip the Ask AI exception when a field is outside the question and history.
SecRule ARGS_NAMES "!@rx ^json\.(?:question|history\.array_(?:[0-9]|1[0-9])\.(?:question|answer))$" \
    "id:100029,phase:2,pass,nolog,t:none,skipAfter:VIGIL-ASK-END"

# Allow code examples in Ask AI JSON text on POST requests without query arguments.
SecRule REQUEST_FILENAME "@rx ^/api/alerts/[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}/ask$" \
    "id:100030,phase:2,pass,nolog,t:none,chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,chain"
        SecRule REQBODY_PROCESSOR "@streq JSON" "t:none,chain"
            SecRule &ARGS_GET "@eq 0" \
                "t:none,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS,\
                ctl:ruleRemoveTargetByTag=attack-xss;ARGS,\
                ctl:ruleRemoveTargetByTag=attack-rce;ARGS"

# End of the Ask AI exception.
SecMarker VIGIL-ASK-END

# Allow access lines and Java stack traces in Protobuf OTLP log bodies.
SecRule REQUEST_URI_RAW "@streq /otlp/v1/logs" \
    "id:100040,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,chain"
        SecRule REQUEST_HEADERS:Content-Type "@streq application/x-protobuf" \
            "t:none,t:lowercase,ctl:ruleRemoveTargetById=921110;REQUEST_BODY,\
            ctl:ruleRemoveTargetById=944100;REQUEST_BODY,\
            ctl:ruleRemoveTargetById=944110;REQUEST_BODY,\
            ctl:ruleRemoveTargetById=944130;REQUEST_BODY"

# Allow access lines and timeout messages in the log search field.
SecRule REQUEST_FILENAME "@streq /api/telemetry/logs" \
    "id:100050,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,ctl:ruleRemoveTargetById=932260;ARGS:search,\
        ctl:ruleRemoveTargetById=921110;ARGS:search,\
        ctl:ruleRemoveTargetById=921130;ARGS:search"
